      - name: Build debug APK
        working-directory: PageCurlComics
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeynosComicReader-debug-apk
          path: PageCurlComics/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' PageCurlComics/app/build.gradle.kts)
          cp PageCurlComics/app/build/outputs/apk/debug/app-debug.apk FeynosComicReader-$VER.apk
          gh release create "v$VER" "FeynosComicReader-$VER.apk" --repo "$GITHUB_REPOSITORY" --title "Feynos ComicReader $VER" --notes "Version $VER" --latest \
            || gh release upload "v$VER" "FeynosComicReader-$VER.apk" --repo "$GITHUB_REPOSITORY" --clobber
